server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Svelte SPA:
    # неизвестные URL возвращаем в index.html,
    # дальше маршрут разбирает svelte-spa-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Все API-запросы отправляем в backend-контейнер.
    location /api/ {
        proxy_pass http://backend:8080/web-lab-3/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}